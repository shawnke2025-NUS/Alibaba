name: Run V2 synthetic simulation

on:
  push:
    branches:
      - v2-phase1-phase2
    paths:
      - ".github/workflows/run-v2.yml"
      - "single-instance-simulation/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout V2 branch
        uses: actions/checkout@v4
        with:
          ref: v2-phase1-phase2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: single-instance-simulation/requirements.txt

      - name: Install dependencies
        working-directory: single-instance-simulation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ml.txt

      - name: Run V2 unit tests
        working-directory: single-instance-simulation
        run: python -m unittest discover -s tests -v

      - name: Run paired V2 experiments (4 workloads x 5 policies x 5 seeds)
        working-directory: single-instance-simulation
        run: |
          python single_instance_sim.py --horizon 45 --seeds 5 --out results_v2

      - name: Generate V2 figures and run manifest
        working-directory: single-instance-simulation
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt

          out = Path("results_v2")
          figdir = out / "figures"
          figdir.mkdir(parents=True, exist_ok=True)
          raw = pd.read_csv(out / "runs_v2.csv")
          summary = pd.read_csv(out / "summary_v2.csv")

          metrics = [
              ("p99_ttft_ms_mean", "P99 TTFT", "ms"),
              ("p99_tpot_ms_mean", "P99 TPOT", "ms"),
              ("p99_itl_ms_mean", "P99 ITL", "ms"),
              ("request_throughput_rps_mean", "Request Throughput", "req/s"),
              ("goodput_rps_mean", "Goodput", "req/s"),
              ("goodput_attainment_mean", "Goodput Attainment", "fraction"),
          ]
          for column, title, unit in metrics:
              fig, ax = plt.subplots(figsize=(10, 5.8))
              for workload in ["low", "medium", "high", "overload"]:
                  part = summary[summary["workload"] == workload].set_index("policy")
                  ax.plot(part.index, part[column], marker="o", linewidth=2, label=workload)
              ax.set_title(f"{title} — V2 synthetic simulation")
              ax.set_xlabel("Scheduling policy")
              ax.set_ylabel(unit)
              ax.tick_params(axis="x", rotation=20)
              ax.grid(True, alpha=0.3)
              ax.legend(title="Workload")
              fig.tight_layout()
              fig.savefig(figdir / f"{column}.png", dpi=180)
              plt.close(fig)

          manifest = {
              "branch": "v2-phase1-phase2",
              "runtime_model": "SyntheticCostModel",
              "hardware_calibration": False,
              "horizon_seconds": 45,
              "seeds_per_workload_policy": 5,
              "workloads": ["low", "medium", "high", "overload"],
              "policies": ["fixed256", "fixed1024", "gpu_threshold", "deadline_adaptive", "priority_deadline"],
              "runs_expected": 100,
              "runs_actual": int(len(raw)),
              "trace_pairing": "same workload+seed trace across all policies",
              "notes": "Synthetic simulation only; not RTX 3090/Qwen3-32B measured performance."
          }
          (out / "RUN_MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (out / "RUN_REPORT.md").write_text(
              "# V2 Synthetic Simulation Results\n\n"
              "> SyntheticCostModel only. These results are not measured RTX 3090/Qwen3-32B performance.\n\n"
              "## Experiment setup\n\n"
              "- 4 workloads x 5 policies x 5 paired seeds = 100 runs\n"
              "- 45-second offered-load window per run; bounded drain period\n"
              "- Same request trace for all policies within each workload/seed pair\n"
              "- Summary reports mean, standard deviation, and Student-t 95% CI half-width\n\n"
              "## Files\n\n"
              "- runs_v2.csv: per-seed raw results\n"
              "- summary_v2.csv: aggregate results and confidence intervals\n"
              "- figures/: metric curves\n"
              "- RUN_MANIFEST.json: reproducibility metadata\n\n"
              "## Interpretation caveat\n\n"
              "Do not compare these values directly with V1 or paper results unless request traces, SLOs, runtime model, measurement window, and metric denominators are made identical.\n"
          )
          print(f"Generated figures. Raw runs: {len(raw)}; summary rows: {len(summary)}")
          PY

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2-synthetic-results
          path: single-instance-simulation/results_v2/
          if-no-files-found: error
          retention-days: 30

      - name: Commit results to V2 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f single-instance-simulation/results_v2
          if ! git diff --cached --quiet; then
            git commit -m "results(v2): add paired synthetic simulation outputs"
            git push origin HEAD:v2-phase1-phase2
          fi
